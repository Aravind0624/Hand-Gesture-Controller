<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" width="100%" height="100%">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#050814" />
      <stop offset="50%" stop-color="#0b1329" />
      <stop offset="100%" stop-color="#030611" />
    </linearGradient>

    <!-- Neon Glow Accents -->
    <linearGradient id="cyanPurple" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f5ff" />
      <stop offset="100%" stop-color="#a855f7" />
    </linearGradient>

    <linearGradient id="holoGlow" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#00f5ff" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#3b82f6" stop-opacity="0.2" />
    </linearGradient>

    <linearGradient id="goldGlow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#ef4444" />
    </linearGradient>

    <!-- Glowing Filters -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <filter id="strongGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="8" result="blur1" />
      <feGaussianBlur stdDeviation="16" result="blur2" />
      <feMerge>
        <feMergeNode in="blur2" />
        <feMergeNode in="blur1" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <!-- 3D Perspective Grid Pattern -->
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#1e293b" stroke-width="0.75" stroke-opacity="0.5"/>
    </pattern>
  </defs>

  <style>
    /* CSS Keyframe Animations */
    @keyframes rotateClockwise {
      from { transform: rotate(0deg); }
      to { transform: rotate(360deg); }
    }
    @keyframes rotateCounterClockwise {
      from { transform: rotate(360deg); }
      to { transform: rotate(0deg); }
    }
    @keyframes pulseGlow {
      0%, 100% { opacity: 0.6; filter: drop-shadow(0 0 8px #00f5ff); }
      50% { opacity: 1; filter: drop-shadow(0 0 20px #00f5ff); }
    }
    @keyframes float3D {
      0%, 100% { transform: translateY(0px) rotateX(0deg); }
      50% { transform: translateY(-12px) rotateX(4deg); }
    }
    @keyframes scanline {
      0% { transform: translateY(-50px); opacity: 0; }
      50% { opacity: 0.8; }
      100% { transform: translateY(440px); opacity: 0; }
    }
    @keyframes nodePulse {
      0%, 100% { r: 4.5; fill: #00f5ff; }
      50% { r: 6.5; fill: #ffffff; }
    }
    @keyframes signalDash {
      to { stroke-dashoffset: -100; }
    }

    .reticle-outer {
      transform-origin: 920px 210px;
      animation: rotateClockwise 24s linear infinite;
    }
    .reticle-inner {
      transform-origin: 920px 210px;
      animation: rotateCounterClockwise 16s linear infinite;
    }
    .reticle-core {
      transform-origin: 920px 210px;
      animation: rotateClockwise 8s linear infinite;
    }
    .floating-hand {
      animation: float3D 6s ease-in-out infinite;
      transform-origin: 920px 210px;
    }
    .scan-beam {
      animation: scanline 4s ease-in-out infinite;
    }
    .node-point {
      animation: nodePulse 2.5s ease-in-out infinite;
    }
    .animated-pulse {
      animation: pulseGlow 3s ease-in-out infinite;
    }
    .data-stream {
      stroke-dasharray: 6, 6;
      animation: signalDash 3s linear infinite;
    }
  </style>

  <!-- Deep Sci-Fi Background -->
  <rect width="1200" height="420" fill="url(#bgGrad)" rx="16" />

  <!-- Ambient Light Orbs -->
  <circle cx="200" cy="80" r="180" fill="#00f5ff" opacity="0.06" filter="url(#strongGlow)" />
  <circle cx="950" cy="200" r="220" fill="#7928ca" opacity="0.12" filter="url(#strongGlow)" />
  <circle cx="600" cy="350" r="150" fill="#3b82f6" opacity="0.08" filter="url(#strongGlow)" />

  <!-- Matrix Grid -->
  <rect width="1200" height="420" fill="url(#grid)" opacity="0.7" rx="16" />

  <!-- Tech Frame Border -->
  <rect x="15" y="15" width="1170" height="390" fill="none" stroke="#00f5ff" stroke-width="1" stroke-opacity="0.25" rx="12" />
  <circle cx="15" cy="15" r="4" fill="#00f5ff" opacity="0.8" />
  <circle cx="1185" cy="15" r="4" fill="#00f5ff" opacity="0.8" />
  <circle cx="15" cy="405" r="4" fill="#00f5ff" opacity="0.8" />
  <circle cx="1185" cy="405" r="4" fill="#00f5ff" opacity="0.8" />

  <!-- Corner Brackets -->
  <path d="M 15 45 L 15 15 L 45 15" fill="none" stroke="#00f5ff" stroke-width="2.5" />
  <path d="M 1155 15 L 1185 15 L 1185 45" fill="none" stroke="#00f5ff" stroke-width="2.5" />
  <path d="M 15 375 L 15 405 L 45 405" fill="none" stroke="#00f5ff" stroke-width="2.5" />
  <path d="M 1155 405 L 1185 405 L 1185 375" fill="none" stroke="#00f5ff" stroke-width="2.5" />

  <!-- Left Side: Typography & Hero Badges -->
  <g transform="translate(60, 0)">
    <!-- Top System Status Pill -->
    <g transform="translate(0, 52)">
      <rect width="210" height="28" rx="14" fill="#00f5ff" fill-opacity="0.1" stroke="#00f5ff" stroke-width="1" stroke-opacity="0.4" />
      <circle cx="14" cy="14" r="5" fill="#10b981" filter="url(#glow)">
        <animate attributeName="opacity" values="1;0.3;1" dur="1.8s" repeatCount="indefinite" />
      </circle>
      <text x="28" y="18" fill="#00f5ff" font-family="'Segoe UI', -apple-system, Roboto, sans-serif" font-size="11" font-weight="700" letter-spacing="1.5">SYSTEM ACTIVE // V3.0</text>
    </g>

    <!-- Title J.A.R.V.I.S -->
    <text x="0" y="132" fill="#ffffff" font-family="'Segoe UI', -apple-system, 'Montserrat', Roboto, sans-serif" font-size="46" font-weight="900" letter-spacing="2">
      AI HAND GESTURE
    </text>
    <text x="0" y="180" fill="url(#cyanPurple)" font-family="'Segoe UI', -apple-system, 'Montserrat', Roboto, sans-serif" font-size="46" font-weight="900" letter-spacing="3" filter="url(#glow)">
      CONTROL INTERFACE
    </text>

    <!-- Subtitle / Tagline -->
    <text x="0" y="218" fill="#94a3b8" font-family="'Segoe UI', -apple-system, Roboto, sans-serif" font-size="15" font-weight="400" letter-spacing="0.5">
      Next-Gen Optical Air Mouse with Physics Momentum &amp; 3D Landmark Tracking
    </text>

    <!-- Feature Metric Pills -->
    <g transform="translate(0, 255)">
      <!-- Pill 1: MediaPipe 21 Landmarks -->
      <g>
        <rect width="165" height="58" rx="10" fill="#0f172a" fill-opacity="0.8" stroke="#334155" stroke-width="1.2" />
        <rect width="165" height="58" rx="10" fill="none" stroke="#00f5ff" stroke-width="1.2" stroke-opacity="0.4" />
        <text x="14" y="25" fill="#38bdf8" font-family="'Segoe UI', sans-serif" font-size="10" font-weight="700" letter-spacing="1">VISION ENGINE</text>
        <text x="14" y="47" fill="#ffffff" font-family="'Segoe UI', sans-serif" font-size="17" font-weight="800">21 3D Nodes</text>
      </g>

      <!-- Pill 2: OneEuroFilter -->
      <g transform="translate(180, 0)">
        <rect width="165" height="58" rx="10" fill="#0f172a" fill-opacity="0.8" stroke="#334155" stroke-width="1.2" />
        <rect width="165" height="58" rx="10" fill="none" stroke="#a855f7" stroke-width="1.2" stroke-opacity="0.4" />
        <text x="14" y="25" fill="#c084fc" font-family="'Segoe UI', sans-serif" font-size="10" font-weight="700" letter-spacing="1">JITTER REDUCTION</text>
        <text x="14" y="47" fill="#ffffff" font-family="'Segoe UI', sans-serif" font-size="17" font-weight="800">1€ Filter Math</text>
      </g>

      <!-- Pill 3: Physics Momentum -->
      <g transform="translate(360, 0)">
        <rect width="165" height="58" rx="10" fill="#0f172a" fill-opacity="0.8" stroke="#334155" stroke-width="1.2" />
        <rect width="165" height="58" rx="10" fill="none" stroke="#10b981" stroke-width="1.2" stroke-opacity="0.4" />
        <text x="14" y="25" fill="#34d399" font-family="'Segoe UI', sans-serif" font-size="10" font-weight="700" letter-spacing="1">DYNAMICS</text>
        <text x="14" y="47" fill="#ffffff" font-family="'Segoe UI', sans-serif" font-size="17" font-weight="800">Kinetic Physics</text>
      </g>
    </g>

    <!-- Bottom Command Prompt -->
    <g transform="translate(0, 345)">
      <rect width="525" height="34" rx="8" fill="#030712" stroke="#1e293b" stroke-width="1" />
      <text x="16" y="22" fill="#10b981" font-family="'Fira Code', 'Courier New', monospace" font-size="13" font-weight="600">$</text>
      <text x="34" y="22" fill="#e2e8f0" font-family="'Fira Code', 'Courier New', monospace" font-size="12">python main_v3.py</text>
      <text x="175" y="22" fill="#64748b" font-family="'Fira Code', 'Courier New', monospace" font-size="12"># Sci-Fi Holographic HUD Interface</text>
    </g>
  </g>

  <!-- Right Side: 3D Holographic Hand & Rotating Target Reticle -->
  <g id="hologram-stage">
    <!-- Ambient Target Circles -->
    <circle cx="920" cy="210" r="170" fill="none" stroke="#00f5ff" stroke-width="1" stroke-opacity="0.1" />
    <circle cx="920" cy="210" r="140" fill="none" stroke="#a855f7" stroke-width="1" stroke-opacity="0.15" />

    <!-- Outer Rotating Reticle -->
    <g class="reticle-outer">
      <circle cx="920" cy="210" r="160" fill="none" stroke="#00f5ff" stroke-width="1.5" stroke-dasharray="14 18 35 12" stroke-opacity="0.4" />
      <path d="M 920 40 L 920 55 M 920 365 L 920 380 M 750 210 L 765 210 M 1075 210 L 1090 210" stroke="#00f5ff" stroke-width="2" stroke-opacity="0.7" />
    </g>

    <!-- Inner Counter-Rotating Reticle -->
    <g class="reticle-inner">
      <circle cx="920" cy="210" r="125" fill="none" stroke="#a855f7" stroke-width="1.5" stroke-dasharray="8 20 40 10" stroke-opacity="0.6" />
      <!-- Target ticks -->
      <circle cx="920" cy="85" r="3" fill="#a855f7" />
      <circle cx="920" cy="335" r="3" fill="#a855f7" />
      <circle cx="795" cy="210" r="3" fill="#a855f7" />
      <circle cx="1045" cy="210" r="3" fill="#a855f7" />
    </g>

    <!-- Core Target Crosshair -->
    <g class="reticle-core">
      <circle cx="920" cy="210" r="60" fill="none" stroke="#38bdf8" stroke-width="1" stroke-dasharray="4 8" stroke-opacity="0.5" />
    </g>

    <!-- Holographic Scan Beam Animation -->
    <line x1="750" y1="210" x2="1090" y2="210" stroke="#00f5ff" stroke-width="2" stroke-opacity="0.5" filter="url(#glow)" class="scan-beam" />

    <!-- 3D Holographic Hand Wireframe & 21 Landmarks -->
    <g class="floating-hand">
      <!-- Palm Mesh & Finger Skeleton Bones -->
      <g stroke="#00f5ff" stroke-width="2" stroke-opacity="0.75" filter="url(#glow)">
        <!-- Wrist to MCP joints -->
        <line x1="920" y1="315" x2="865" y2="265" /> <!-- Wrist to Thumb CMC -->
        <line x1="920" y1="315" x2="885" y2="225" /> <!-- Wrist to Index MCP -->
        <line x1="920" y1="315" x2="920" y2="215" /> <!-- Wrist to Middle MCP -->
        <line x1="920" y1="315" x2="955" y2="225" /> <!-- Wrist to Ring MCP -->
        <line x1="920" y1="315" x2="985" y2="245" /> <!-- Wrist to Pinky MCP -->

        <!-- Palm Transverse Arch -->
        <line x1="885" y1="225" x2="920" y2="215" stroke-opacity="0.4" stroke-dasharray="3 3" />
        <line x1="920" y1="215" x2="955" y2="225" stroke-opacity="0.4" stroke-dasharray="3 3" />
        <line x1="955" y1="225" x2="985" y2="245" stroke-opacity="0.4" stroke-dasharray="3 3" />

        <!-- Thumb Chain -->
        <line x1="865" y1="265" x2="840" y2="240" />
        <line x1="840" y1="240" x2="828" y2="210" />
        <line x1="828" y1="210" x2="825" y2="185" />

        <!-- Index Finger Chain (Pointer Raised) -->
        <line x1="885" y1="225" x2="882" y2="175" />
        <line x1="882" y1="175" x2="880" y2="135" />
        <line x1="880" y1="135" x2="880" y2="95" stroke="#ffffff" stroke-width="2.5" />

        <!-- Middle Finger Chain -->
        <line x1="920" y1="215" x2="920" y2="170" />
        <line x1="920" y1="170" x2="920" y2="130" />
        <line x1="920" y1="130" x2="920" y2="105" />

        <!-- Ring Finger Chain (Curled) -->
        <line x1="955" y1="225" x2="960" y2="190" />
        <line x1="960" y1="190" x2="955" y2="165" />
        <line x1="955" y1="165" x2="950" y2="145" />

        <!-- Pinky Finger Chain (Curled) -->
        <line x1="985" y1="245" x2="995" y2="215" />
        <line x1="995" y1="215" x2="990" y2="190" />
        <line x1="990" y1="190" x2="985" y2="170" />
      </g>

      <!-- Laser Interaction Ray between Index Tip and Thumb (Pinch Detection) -->
      <line x1="880" y1="95" x2="825" y2="185" stroke="#ef4444" stroke-width="1.5" stroke-dasharray="4 4" opacity="0.8">
        <animate attributeName="stroke-opacity" values="0.9;0.2;0.9" dur="1.2s" repeatCount="indefinite" />
      </line>

      <!-- 21 Landmark Nodes (MediaPipe Hand Skeleton) -->
      <!-- Wrist -->
      <circle cx="920" cy="315" r="5" fill="#a855f7" filter="url(#glow)" />

      <!-- Thumb (1-4) -->
      <circle cx="865" cy="265" r="4" fill="#00f5ff" />
      <circle cx="840" cy="240" r="4" fill="#00f5ff" />
      <circle cx="828" cy="210" r="4.5" fill="#00f5ff" />
      <circle cx="825" cy="185" r="6" fill="#f59e0b" filter="url(#glow)" class="node-point" />

      <!-- Index (5-8) -->
      <circle cx="885" cy="225" r="4" fill="#00f5ff" />
      <circle cx="882" cy="175" r="4" fill="#00f5ff" />
      <circle cx="880" cy="135" r="4.5" fill="#00f5ff" />
      <!-- Target Cursor Node (Index Tip) -->
      <circle cx="880" cy="95" r="8" fill="#ffffff" filter="url(#strongGlow)">
        <animate attributeName="r" values="7;10;7" dur="1.5s" repeatCount="indefinite" />
      </circle>
      <circle cx="880" cy="95" r="16" fill="none" stroke="#00f5ff" stroke-width="1.5" opacity="0.8">
        <animate attributeName="r" values="12;22;12" dur="1.5s" repeatCount="indefinite" />
        <animate attributeName="opacity" values="0.9;0;0.9" dur="1.5s" repeatCount="indefinite" />
      </circle>

      <!-- Middle (9-12) -->
      <circle cx="920" cy="215" r="4" fill="#00f5ff" />
      <circle cx="920" cy="170" r="4" fill="#00f5ff" />
      <circle cx="920" cy="130" r="4" fill="#00f5ff" />
      <circle cx="920" cy="105" r="5" fill="#00f5ff" />

      <!-- Ring (13-16) -->
      <circle cx="955" cy="225" r="4" fill="#00f5ff" />
      <circle cx="960" cy="190" r="4" fill="#00f5ff" />
      <circle cx="955" cy="165" r="4" fill="#00f5ff" />
      <circle cx="950" cy="145" r="4.5" fill="#00f5ff" />

      <!-- Pinky (17-20) -->
      <circle cx="985" cy="245" r="4" fill="#00f5ff" />
      <circle cx="995" cy="215" r="4" fill="#00f5ff" />
      <circle cx="990" cy="190" r="4" fill="#00f5ff" />
      <circle cx="985" cy="170" r="4" fill="#00f5ff" />
    </g>

    <!-- Floating HUD Reticle Labels -->
    <g transform="translate(730, 80)">
      <rect width="90" height="20" rx="4" fill="#000000" fill-opacity="0.6" stroke="#00f5ff" stroke-width="0.8" />
      <text x="7" y="14" fill="#00f5ff" font-family="'Segoe UI', monospace" font-size="9" font-weight="700">LOCK: INDEX_TIP</text>
    </g>

    <g transform="translate(1010, 310)">
      <rect width="95" height="20" rx="4" fill="#000000" fill-opacity="0.6" stroke="#a855f7" stroke-width="0.8" />
      <text x="7" y="14" fill="#c084fc" font-family="'Segoe UI', monospace" font-size="9" font-weight="700">FPS: 60 [STABLE]</text>
    </g>
  </g>
</svg>
