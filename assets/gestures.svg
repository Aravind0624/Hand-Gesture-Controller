<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 240" width="100%" height="100%">
  <defs>
    <linearGradient id="gBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#070b16"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <filter id="gGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="b"/>
      <feMerge>
        <feMergeNode in="b"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <style>
    @keyframes pulseCard {
      0%, 100% { opacity: 0.85; }
      50% { opacity: 1; }
    }
    @keyframes ringPulse {
      0%, 100% { transform: scale(1); opacity: 0.8; }
      50% { transform: scale(1.08); opacity: 0.3; }
    }
    .card-item {
      animation: pulseCard 4s ease-in-out infinite;
    }
  </style>

  <rect width="1100" height="240" fill="url(#gBg)" rx="14" stroke="#1e293b" stroke-width="1.5"/>

  <!-- Card 1: MOVE CURSOR -->
  <g transform="translate(25, 25)" class="card-item">
    <rect width="195" height="190" rx="12" fill="#00f5ff" fill-opacity="0.06" stroke="#00f5ff" stroke-width="1.5"/>
    <circle cx="97" cy="55" r="30" fill="#00f5ff" fill-opacity="0.1" stroke="#00f5ff" stroke-width="1.5" filter="url(#gGlow)"/>
    <text x="97" y="63" font-size="26" text-anchor="middle">👆</text>
    <text x="97" y="112" fill="#00f5ff" font-family="'Segoe UI', sans-serif" font-size="14" font-weight="800" text-anchor="middle" letter-spacing="1">MOVE CURSOR</text>
    <text x="97" y="135" fill="#e2e8f0" font-family="'Segoe UI', sans-serif" font-size="11" font-weight="600" text-anchor="middle">Index Finger Up</text>
    <text x="97" y="155" fill="#94a3b8" font-family="'Segoe UI', sans-serif" font-size="10" text-anchor="middle">Kinetic Tracking</text>
    <rect x="35" y="170" width="125" height="22" rx="11" fill="#00f5ff" fill-opacity="0.2"/>
    <text x="97" y="185" fill="#38bdf8" font-family="'Segoe UI', sans-serif" font-size="9.5" font-weight="700" text-anchor="middle">STATUS: ACTIVE</text>
  </g>

  <!-- Card 2: LEFT CLICK -->
  <g transform="translate(235, 25)" class="card-item">
    <rect width="195" height="190" rx="12" fill="#f59e0b" fill-opacity="0.06" stroke="#f59e0b" stroke-width="1.5"/>
    <circle cx="97" cy="55" r="30" fill="#f59e0b" fill-opacity="0.1" stroke="#f59e0b" stroke-width="1.5" filter="url(#gGlow)"/>
    <text x="97" y="63" font-size="26" text-anchor="middle">🤏</text>
    <text x="97" y="112" fill="#f59e0b" font-family="'Segoe UI', sans-serif" font-size="14" font-weight="800" text-anchor="middle" letter-spacing="1">LEFT CLICK</text>
    <text x="97" y="135" fill="#e2e8f0" font-family="'Segoe UI', sans-serif" font-size="11" font-weight="600" text-anchor="middle">Thumb + Index Pinch</text>
    <text x="97" y="155" fill="#94a3b8" font-family="'Segoe UI', sans-serif" font-size="10" text-anchor="middle">Distance &lt; 60px</text>
    <rect x="35" y="170" width="125" height="22" rx="11" fill="#f59e0b" fill-opacity="0.2"/>
    <text x="97" y="185" fill="#fbbf24" font-family="'Segoe UI', sans-serif" font-size="9.5" font-weight="700" text-anchor="middle">HOLD: 0.20s</text>
  </g>

  <!-- Card 3: RIGHT CLICK -->
  <g transform="translate(445, 25)" class="card-item">
    <rect width="195" height="190" rx="12" fill="#a855f7" fill-opacity="0.06" stroke="#a855f7" stroke-width="1.5"/>
    <circle cx="97" cy="55" r="30" fill="#a855f7" fill-opacity="0.1" stroke="#a855f7" stroke-width="1.5" filter="url(#gGlow)"/>
    <text x="97" y="63" font-size="26" text-anchor="middle">🫰</text>
    <text x="97" y="112" fill="#a855f7" font-family="'Segoe UI', sans-serif" font-size="14" font-weight="800" text-anchor="middle" letter-spacing="1">RIGHT CLICK</text>
    <text x="97" y="135" fill="#e2e8f0" font-family="'Segoe UI', sans-serif" font-size="11" font-weight="600" text-anchor="middle">Thumb + Middle Pinch</text>
    <text x="97" y="155" fill="#94a3b8" font-family="'Segoe UI', sans-serif" font-size="10" text-anchor="middle">Context Menu Trigger</text>
    <rect x="35" y="170" width="125" height="22" rx="11" fill="#a855f7" fill-opacity="0.2"/>
    <text x="97" y="185" fill="#c084fc" font-family="'Segoe UI', sans-serif" font-size="9.5" font-weight="700" text-anchor="middle">HOLD: 0.25s</text>
  </g>

  <!-- Card 4: SCROLL MODE -->
  <g transform="translate(655, 25)" class="card-item">
    <rect width="195" height="190" rx="12" fill="#3b82f6" fill-opacity="0.06" stroke="#3b82f6" stroke-width="1.5"/>
    <circle cx="97" cy="55" r="30" fill="#3b82f6" fill-opacity="0.1" stroke="#3b82f6" stroke-width="1.5" filter="url(#gGlow)"/>
    <text x="97" y="63" font-size="26" text-anchor="middle">✌️</text>
    <text x="97" y="112" fill="#3b82f6" font-family="'Segoe UI', sans-serif" font-size="14" font-weight="800" text-anchor="middle" letter-spacing="1">SCROLL MODE</text>
    <text x="97" y="135" fill="#e2e8f0" font-family="'Segoe UI', sans-serif" font-size="11" font-weight="600" text-anchor="middle">Index + Middle Up</text>
    <text x="97" y="155" fill="#94a3b8" font-family="'Segoe UI', sans-serif" font-size="10" text-anchor="middle">Hand Up/Down Motion</text>
    <rect x="35" y="170" width="125" height="22" rx="11" fill="#3b82f6" fill-opacity="0.2"/>
    <text x="97" y="185" fill="#60a5fa" font-family="'Segoe UI', sans-serif" font-size="9.5" font-weight="700" text-anchor="middle">SPEED: 30 px/step</text>
  </g>

  <!-- Card 5: SAFETY PAUSE -->
  <g transform="translate(865, 25)" class="card-item">
    <rect width="195" height="190" rx="12" fill="#ef4444" fill-opacity="0.06" stroke="#ef4444" stroke-width="1.5"/>
    <circle cx="97" cy="55" r="30" fill="#ef4444" fill-opacity="0.1" stroke="#ef4444" stroke-width="1.5" filter="url(#gGlow)"/>
    <text x="97" y="63" font-size="26" text-anchor="middle">✊</text>
    <text x="97" y="112" fill="#ef4444" font-family="'Segoe UI', sans-serif" font-size="14" font-weight="800" text-anchor="middle" letter-spacing="1">SAFETY PAUSE</text>
    <text x="97" y="135" fill="#e2e8f0" font-family="'Segoe UI', sans-serif" font-size="11" font-weight="600" text-anchor="middle">Closed Fist / 'Q'</text>
    <text x="97" y="155" fill="#94a3b8" font-family="'Segoe UI', sans-serif" font-size="10" text-anchor="middle">Instant Cursor Lock</text>
    <rect x="35" y="170" width="125" height="22" rx="11" fill="#ef4444" fill-opacity="0.2"/>
    <text x="97" y="185" fill="#f87171" font-family="'Segoe UI', sans-serif" font-size="9.5" font-weight="700" text-anchor="middle">SAFETY LOCK</text>
  </g>
</svg>
