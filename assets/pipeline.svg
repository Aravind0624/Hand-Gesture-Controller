<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 240" width="100%" height="100%">
  <defs>
    <linearGradient id="pGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090d1a"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="cardGrad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f5ff" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#00f5ff" stop-opacity="0.02"/>
    </linearGradient>
    <linearGradient id="cardGrad2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#a855f7" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#a855f7" stop-opacity="0.02"/>
    </linearGradient>
    <linearGradient id="cardGrad3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3b82f6" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#3b82f6" stop-opacity="0.02"/>
    </linearGradient>
    <linearGradient id="cardGrad4" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#10b981" stop-opacity="0.02"/>
    </linearGradient>
    <filter id="pGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="b"/>
      <feMerge>
        <feMergeNode in="b"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <style>
    @keyframes pulseData {
      0% { stroke-dashoffset: 60; }
      100% { stroke-dashoffset: 0; }
    }
    @keyframes cardFloat {
      0%, 100% { transform: translateY(0px); }
      50% { transform: translateY(-4px); }
    }
    .flow-line {
      stroke-dasharray: 8, 6;
      animation: pulseData 1.5s linear infinite;
    }
    .hover-card {
      transition: all 0.3s ease;
    }
  </style>

  <!-- Background -->
  <rect width="1000" height="240" fill="url(#pGrad)" rx="14" stroke="#1e293b" stroke-width="1.5"/>

  <!-- Connecting Data Stream Lines -->
  <path d="M 215 120 L 275 120" stroke="#00f5ff" stroke-width="3" fill="none" class="flow-line" filter="url(#pGlow)" />
  <path d="M 455 120 L 515 120" stroke="#a855f7" stroke-width="3" fill="none" class="flow-line" filter="url(#pGlow)" />
  <path d="M 695 120 L 755 120" stroke="#3b82f6" stroke-width="3" fill="none" class="flow-line" filter="url(#pGlow)" />

  <!-- Node 1: Video Capture -->
  <g transform="translate(35, 40)" class="hover-card">
    <rect width="180" height="155" rx="12" fill="url(#cardGrad1)" stroke="#00f5ff" stroke-width="1.5" stroke-opacity="0.6"/>
    <circle cx="90" cy="45" r="24" fill="#00f5ff" fill-opacity="0.1" stroke="#00f5ff" stroke-width="1.5"/>
    <text x="90" y="52" fill="#00f5ff" font-family="'Segoe UI', sans-serif" font-size="20" text-anchor="middle">📹</text>
    <text x="90" y="95" fill="#ffffff" font-family="'Segoe UI', sans-serif" font-size="14" font-weight="700" text-anchor="middle">Optical Sensor</text>
    <text x="90" y="115" fill="#38bdf8" font-family="'Segoe UI', sans-serif" font-size="11" font-weight="600" text-anchor="middle">OpenCV 60 FPS</text>
    <text x="90" y="132" fill="#94a3b8" font-family="'Segoe UI', sans-serif" font-size="10" text-anchor="middle">Webcam RGB Stream</text>
  </g>

  <!-- Node 2: MediaPipe Hand Landmarker -->
  <g transform="translate(275, 40)" class="hover-card">
    <rect width="180" height="155" rx="12" fill="url(#cardGrad2)" stroke="#a855f7" stroke-width="1.5" stroke-opacity="0.6"/>
    <circle cx="90" cy="45" r="24" fill="#a855f7" fill-opacity="0.1" stroke="#a855f7" stroke-width="1.5"/>
    <text x="90" y="52" fill="#a855f7" font-family="'Segoe UI', sans-serif" font-size="20" text-anchor="middle">🖐️</text>
    <text x="90" y="95" fill="#ffffff" font-family="'Segoe UI', sans-serif" font-size="14" font-weight="700" text-anchor="middle">3D Landmarker</text>
    <text x="90" y="115" fill="#c084fc" font-family="'Segoe UI', sans-serif" font-size="11" font-weight="600" text-anchor="middle">Google MediaPipe</text>
    <text x="90" y="132" fill="#94a3b8" font-family="'Segoe UI', sans-serif" font-size="10" text-anchor="middle">21 Spatial Points (X,Y,Z)</text>
  </g>

  <!-- Node 3: Physics & Filtering -->
  <g transform="translate(515, 40)" class="hover-card">
    <rect width="180" height="155" rx="12" fill="url(#cardGrad3)" stroke="#3b82f6" stroke-width="1.5" stroke-opacity="0.6"/>
    <circle cx="90" cy="45" r="24" fill="#3b82f6" fill-opacity="0.1" stroke="#3b82f6" stroke-width="1.5"/>
    <text x="90" y="52" fill="#3b82f6" font-family="'Segoe UI', sans-serif" font-size="20" text-anchor="middle">⚡</text>
    <text x="90" y="95" fill="#ffffff" font-family="'Segoe UI', sans-serif" font-size="14" font-weight="700" text-anchor="middle">Physics &amp; Filter</text>
    <text x="90" y="115" fill="#60a5fa" font-family="'Segoe UI', sans-serif" font-size="11" font-weight="600" text-anchor="middle">1€ Filter + Momentum</text>
    <text x="90" y="132" fill="#94a3b8" font-family="'Segoe UI', sans-serif" font-size="10" text-anchor="middle">Jitter Suppression</text>
  </g>

  <!-- Node 4: OS Mouse Control -->
  <g transform="translate(755, 40)" class="hover-card">
    <rect width="180" height="155" rx="12" fill="url(#cardGrad4)" stroke="#10b981" stroke-width="1.5" stroke-opacity="0.6"/>
    <circle cx="90" cy="45" r="24" fill="#10b981" fill-opacity="0.1" stroke="#10b981" stroke-width="1.5"/>
    <text x="90" y="52" fill="#10b981" font-family="'Segoe UI', sans-serif" font-size="20" text-anchor="middle">🖱️</text>
    <text x="90" y="95" fill="#ffffff" font-family="'Segoe UI', sans-serif" font-size="14" font-weight="700" text-anchor="middle">OS Cursor Engine</text>
    <text x="90" y="115" fill="#34d399" font-family="'Segoe UI', sans-serif" font-size="11" font-weight="600" text-anchor="middle">PyAutoGUI Controller</text>
    <text x="90" y="132" fill="#94a3b8" font-family="'Segoe UI', sans-serif" font-size="10" text-anchor="middle">Click, Drag, Scroll, Move</text>
  </g>
</svg>
